<svg xmlns="http://www.w3.org/2000/svg" width="980" height="620" viewBox="0 0 980 620" role="img" aria-label="zstd: latency winner vs throughput winner">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#e0f2fe"/></linearGradient></defs>
<rect width="980" height="620" rx="18" fill="url(#bg)"/>
<text x="30" y="42" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="700" fill="#0f172a">zstd: latency winner vs throughput winner</text>
<text x="30" y="70" font-family="Inter,Arial,sans-serif" font-size="14" fill="#475569">Same dataset, same codec: Zarr leads interactive slices; TileDB leads full scans.</text>
<text x="70" y="118" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Slice GM latency (ms, lower is better)</text>
<text x="70" y="160" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Zarr</text>
<rect x="200" y="142" width="374.5" height="25" rx="7" fill="#2f80ed" opacity="0.9"/>
<text x="566.5" y="159" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">155</text>
<text x="70" y="205" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">TileDB</text>
<rect x="200" y="187" width="427.7" height="25" rx="7" fill="#00a676" opacity="0.9"/>
<text x="619.7" y="204" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">177</text>
<text x="70" y="250" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">HDF5/HSDS</text>
<rect x="200" y="232" width="507.4" height="25" rx="7" fill="#f59e0b" opacity="0.9"/>
<text x="699.4" y="249" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">210</text>
<text x="70" y="295" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">ROOT/TTree</text>
<rect x="200" y="277" width="650.0" height="25" rx="7" fill="#8b5cf6" opacity="0.9"/>
<text x="842.0" y="294" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">269</text>
<line x1="70" y1="342" x2="910" y2="342" stroke="#cbd5e1" stroke-width="1"/>
<text x="70" y="382" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#0f172a">Full-scan throughput (GiB/s, higher is better)</text>
<text x="70" y="424" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">TileDB</text>
<rect x="200" y="406" width="650.0" height="25" rx="7" fill="#00a676" opacity="0.9"/>
<text x="842.0" y="423" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">1.055</text>
<text x="70" y="469" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">Zarr</text>
<rect x="200" y="451" width="217.5" height="25" rx="7" fill="#2f80ed" opacity="0.9"/>
<text x="409.5" y="468" text-anchor="end" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">0.353</text>
<text x="70" y="514" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">HDF5/HSDS</text>
<rect x="200" y="496" width="44.4" height="25" rx="7" fill="#f59e0b" opacity="0.9"/>
<text x="254.4" y="513" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="700" fill="#0f172a">0.072</text>
